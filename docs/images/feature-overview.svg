<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">SnuggleTemp feature overview</title><desc id="desc">Three feature panels: local-first data, budget planning, and optional weather-adjusted projections.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#211832"/><stop offset="1" stop-color="#342650"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#b)"/><g font-family="Inter,Arial,sans-serif"><g transform="translate(44 42)"><rect width="350" height="216" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#66527f"/><circle cx="48" cy="48" r="25" fill="#9b87f5" fill-opacity=".22"/><path d="M38 48l7 7 14-16" fill="none" stroke="#c7b8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="106" fill="#fff" font-size="23" font-weight="700">Local-first</text><text x="28" y="139" fill="#d1c8df" font-size="16">Your records stay on your device.</text><text x="28" y="164" fill="#d1c8df" font-size="16">No project-operated account or server.</text></g><g transform="translate(425 42)"><rect width="350" height="216" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#66527f"/><circle cx="48" cy="48" r="25" fill="#57d6c3" fill-opacity=".18"/><path d="M34 58h28M38 51v-9h20v9M42 38h12" fill="none" stroke="#83f0df" stroke-width="3" stroke-linecap="round"/><text x="28" y="106" fill="#fff" font-size="23" font-weight="700">Budget planning</text><text x="28" y="139" fill="#d1c8df" font-size="16">Track advances and annual costs.</text><text x="28" y="164" fill="#d1c8df" font-size="16">Explore break-even and buffer targets.</text></g><g transform="translate(806 42)"><rect width="350" height="216" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#66527f"/><circle cx="48" cy="48" r="25" fill="#ffb45f" fill-opacity=".18"/><path d="M33 51a12 12 0 0 1 23-4 9 9 0 0 1 2 18H38a8 8 0 0 1-5-14M47 70l-4 8M59 70l-4 8" fill="none" stroke="#ffd19b" stroke-width="3" stroke-linecap="round"/><text x="28" y="106" fill="#fff" font-size="23" font-weight="700">Optional forecast</text><text x="28" y="139" fill="#d1c8df" font-size="16">Seasonal and weather-adjusted</text><text x="28" y="164" fill="#d1c8df" font-size="16">projections, clearly estimates.</text></g></g></svg>
