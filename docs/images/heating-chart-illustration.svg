<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">SnuggleTemp heating dashboard illustration</title><desc id="desc">Illustrative dark dashboard showing monthly heating consumption, previous-year comparison, and dotted projections. Values are fictional.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171326"/><stop offset="1" stop-color="#292044"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#302746"/><stop offset="1" stop-color="#251f38"/></linearGradient></defs>
